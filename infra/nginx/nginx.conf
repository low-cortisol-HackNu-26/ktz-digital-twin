# Nginx reverse proxy configuration.
#
# upstream blocks to define:
#   frontend  → localhost:3000
#   backend   → localhost:8000
#
# server block (port 80 → redirect to 443 in production):
#
#   location / {
#     proxy_pass frontend;
#     Next.js headers: X-Real-IP, X-Forwarded-For, Host
#   }
#
#   location /api/ {
#     proxy_pass backend;
#     Same proxy headers
#   }
#
#   location /ws/ {
#     proxy_pass backend;
#     proxy_http_version 1.1;
#     proxy_set_header Upgrade $http_upgrade;
#     proxy_set_header Connection "upgrade";
#     proxy_read_timeout 86400s;   (keep WS alive)
#   }
#
#   location /docs { proxy_pass backend; }    (Swagger)
#   location /health { proxy_pass backend; }
#
# Rate limiting:
#   limit_req_zone for /api/ zone: 100r/s burst=200
#   limit_req_zone for /ws/  zone: 20 connections per IP
#
# Gzip: on for text/html, application/json, text/css, application/javascript
