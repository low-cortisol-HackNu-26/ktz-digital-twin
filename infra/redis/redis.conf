# Redis configuration for locomotive twin.
#
# Key settings to include:
#
# bind 0.0.0.0               (allow connections from Docker network)
# protected-mode no          (inside Docker network, no external exposure)
# maxmemory 256mb
# maxmemory-policy allkeys-lru   (evict LRU keys when memory full)
#
# Persistence (optional for demo — disable for faster restarts):
# save ""                    (disable RDB snapshots for pure cache mode)
# appendonly no
#
# Pub/Sub settings:
# (no special config needed — Redis default pub/sub works out of the box)
#
# Logging:
# loglevel notice
# logfile ""                 (output to stdout for Docker logs)
